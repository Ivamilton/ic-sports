  <!-- Faixa SPORTS sutil -->
  <text x="60" y="93" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" text-anchor="middle" fill="#94A3B8" letter-spacing="3">SPORTS</text>
