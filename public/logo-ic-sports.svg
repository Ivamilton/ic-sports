  </defs>
  <!-- Escudo externo -->
  <path d="M60 6 L108 26 L108 68 C108 96 60 114 60 114 C60 114 12 96 12 68 L12 26 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linejoin="round"/>
